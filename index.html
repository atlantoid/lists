<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Lists</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Sticky title bar on top, rows in the middle, one fixed bar at the bottom (add, or selection actions). */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --ink: #14201D;
  --muted: #5C6B67;
  --line: #D3DCD8;
  --accent: #0B7A5E;
  --accent-ink: #FFFFFF;
  --picked: #D2D9D6;
  --star: #DE9C00;
  --unstar: #5C6B67;
  --add-ink: #1B1400;
  --del: #CC332B; --on-del: #FFFFFF;  /* the same deep red in both themes */
  --danger: #B3261E;
  --shadow: 0 8px 24px rgba(20, 32, 29, .18);
  --scrim: rgba(20, 32, 29, .38);
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #182120; --ink: #E7EEEB; --muted: #94A39E; --line: #2C3836;
    --accent: #45CFA2; --accent-ink: #06261C; --picked: #36423F; --star: #F4C54A; --unstar: #FFFFFF; --danger: #FF8A80;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #182120; --ink: #E7EEEB; --muted: #94A39E; --line: #2C3836;
  --accent: #45CFA2; --accent-ink: #06261C; --picked: #36423F; --star: #F4C54A; --unstar: #FFFFFF; --danger: #FF8A80;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
/* The app's own Theme setting: "Phone setting" leaves the blocks above in charge; Light or Dark overrides them. */
:root[data-app-theme="light"] {
  --bg: #EEF2F0; --surface: #FFFFFF; --ink: #14201D; --muted: #5C6B67; --line: #D3DCD8;
  --accent: #0B7A5E; --accent-ink: #FFFFFF; --picked: #D2D9D6; --star: #DE9C00; --unstar: #5C6B67; --danger: #B3261E;
  --shadow: 0 8px 24px rgba(20, 32, 29, .18); --scrim: rgba(20, 32, 29, .38);
  color-scheme: light;
}
:root[data-app-theme="dark"] {
  --bg: #0F1514; --surface: #182120; --ink: #E7EEEB; --muted: #94A39E; --line: #2C3836;
  --accent: #45CFA2; --accent-ink: #06261C; --picked: #36423F; --star: #F4C54A; --unstar: #FFFFFF; --danger: #FF8A80;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-block: 0 150px; }

/* Title bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 8px;
  padding-block: 14px 10px;
}
.top h1 { margin: 0; flex: 1; min-width: 0; font: 700 18px/1.15 var(--display); letter-spacing: -.01em; }
#title {
  display: block; width: 100%; max-width: 100%; text-align: left; font: inherit; letter-spacing: inherit;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 6px;
}
#title:disabled { cursor: default; color: var(--ink); }
#title:not(:disabled) { color: var(--accent); font-weight: 600; }
#titleInput {
  flex: 1; min-width: 0; font: 600 18px/1.15 var(--display);
  background: var(--surface); border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 10px;
}
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 20px; font-weight: 600; font-size: 15px;
  border: 1.5px solid var(--line); background: var(--surface); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: .45; cursor: default; }
.chip.danger { color: var(--danger); }
.chip.solid-danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
#back, #menuBtn { width: 40px; padding: 0; display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--muted) 42%, transparent); }
#back, #menuBtn { background: color-mix(in srgb, var(--surface) 90%, white); }
#back { width: 54px; margin-right: 4px; }

body.typing .wrap { padding-bottom: 60vh; }
body.home .row { min-height: 44px; }
body.home .row .main { padding: 4px 0; }
.note { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.note.warn { color: var(--danger); font-weight: 600; }

/* Rows */
#rows { position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 4px; min-height: 56px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding-left: 6px; position: relative;
}
.row.picked { background: var(--picked); }
.row.first-done { margin-top: 40px; }
#rows.folded { padding-bottom: 46px; }
.sect { position: absolute; left: 0; right: 0; height: 40px; list-style: none; }
.sect button { width: 100%; height: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 12px 0 0; color: var(--muted); font-size: 13px; border-radius: 10px; }
.sect svg { transition: transform .18s ease; }
.sect.open svg { transform: rotate(180deg); }
.sorting .sect { opacity: 0; }
.badge { position: absolute; right: 10px; top: -9px; z-index: 4; min-width: 24px; padding: 1px 7px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.more { list-style: none; }
.more.gap { margin-top: 40px; }
.more button { width: 100%; min-height: 40px; color: var(--muted); font-size: 13px; border-radius: 10px; }
.set { padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
.set label { display: flex; align-items: center; gap: 10px; }
.set label span { flex: 1; min-width: 0; }
.set input[type="number"] { width: 72px; height: 40px; flex: none; text-align: center; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; }
.set input[type="number"]:focus { border-color: var(--accent); outline: none; }
.set input[type="checkbox"] {
  -webkit-appearance: none; appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; transition: background .15s ease;
}
.set input[type="checkbox"]::before {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px;
  background: var(--muted); transition: transform .15s ease, background .15s ease;
}
.set input[type="checkbox"]:checked { background: var(--accent); }
.seg { display: flex; flex: none; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 8px 10px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.set .theme-row { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.set .theme-row .seg button { flex: 1; }
.set input[type="checkbox"]:checked::before { transform: translateX(20px); background: var(--accent-ink); }
.box { width: 22px; height: 22px; border: 2.8px solid var(--accent); border-radius: 11px; display: grid; place-items: center; color: var(--accent-ink); }
.box.on { background: var(--accent); border-color: var(--accent); }
.box svg { opacity: 0; }
.box.on svg { opacity: 1; }
.main { flex: 1; min-width: 0; padding: 10px 0; text-align: left; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
.row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.text[contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.text { overflow-wrap: anywhere; white-space: pre-wrap; border-radius: 4px; outline: none; }
.row.done .text { color: var(--muted); }
.name { font: 500 16px/1.25 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.l-ico svg { width: 30px; height: 30px; }
.l-ico { width: 32px; flex: none; margin-right: 8px; display: grid; place-items: center; font-size: 19px; line-height: 1; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.star { width: 40px; flex: none; display: grid; place-items: center; color: var(--star); }
.star svg { width: 30px; height: 30px; }
.row { touch-action: pan-y; padding-right: 12px; }
.row.held { transition: transform .12s ease, box-shadow .12s ease; transform: scale(1.02); box-shadow: var(--shadow); z-index: 3; }
.row.swiping { z-index: 1; transition: none; }
.row.dragging { z-index: 5; transition: none; box-shadow: var(--shadow); cursor: grabbing; }
.row.swiping.settling { transition: transform .18s ease; }
.lead { margin-right: 6px; }
.row:has(.check) { min-height: 46px; }
.row:has(.check) .main { padding: 4px 0; }
.text { line-height: 1.25; }
.under { position: absolute; left: 0; right: 0; z-index: 0; border-radius: 12px; display: flex; align-items: center; padding: 0 20px; list-style: none; }
.under svg { transition: transform .12s ease; }
.under.armed svg { transform: scale(1.35); }
.under.del { background: var(--del); color: var(--on-del); justify-content: flex-start; }
.under.unfav .i-star { fill: none; stroke: var(--unstar); stroke-width: 2; stroke-linejoin: round; }
.under .i-trash { width: 30px; height: 30px; }
.under.armed .i-trash { transform: scale(1.2); }
.under.fav { background: var(--picked); color: var(--star); justify-content: flex-end; }
.under.del .i-star, .under.fav .i-trash { display: none; }

.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.empty strong { display: block; font: 600 20px/1.2 var(--display); color: var(--ink); margin-bottom: 6px; }

/* Bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar-in { max-width: 608px; margin-inline: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#addInput {
  flex: 1; min-width: 0; height: 44px; padding: 0 14px; font-size: 16px;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 22px;
}
#addInput:focus { border-color: var(--accent); outline: none; }
#addInput::placeholder { color: var(--muted); }
#addBtn {
  position: fixed; right: max(20px, calc((100vw - 640px) / 2 + 20px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  width: 58px; height: 58px; border-radius: 29px; display: grid; place-items: center;
  background: var(--star); color: var(--add-ink); box-shadow: var(--shadow);
}
.text:empty::before { content: "\200B"; }
#addBtn .i-done, #addBtn.finish .i-add { display: none; }
#addBtn.finish .i-done { display: block; }
body.typing #addBtn { bottom: calc((20px + var(--lift, 0px)) / var(--zoom, 1) + env(safe-area-inset-bottom, 0px)); }
body.typing.kb-guess #addBtn { bottom: calc((45vh - 63px + var(--lift, 0px)) / var(--zoom, 1)); }   /* undo the text-size zoom so the spot stays put on screen */
.dev { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.dev > span:first-child { flex: 1 0 100%; }
.dev label { flex: 1; gap: 6px; }
.dev label span { font-size: 14px; color: var(--muted); }
.set small.note { display: block; margin-top: 2px; font-size: 13px; line-height: 1.3; color: var(--muted); }
.go { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#overlay { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; }
#overlay.menu { align-items: flex-start; justify-content: flex-end; padding: calc(env(safe-area-inset-top, 0px) + 60px) max(16px, calc((100vw - 640px) / 2 + 16px)) 16px 16px; }
#overlay.modal { align-items: center; justify-content: center; padding: 24px; }
#panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(300px, 100%); max-height: 70vh; overflow: auto; padding: 8px; }
.p-title { color: var(--accent); margin: 0; padding: 8px 12px 6px; font: 600 16px/1.3 var(--body); overflow-wrap: anywhere; }
.modal .p-title { font: 700 19px/1.25 var(--display); padding-top: 12px; }
.p-hint { margin: 0; padding: 0 12px 10px; font-size: 14px; color: var(--muted); }
.opt { display: block; width: 100%; text-align: left; min-height: 48px; padding: 6px 12px; border-radius: 8px; font-weight: 500; overflow-wrap: anywhere; }
.opt:hover, .opt:active { background: var(--bg); }
.opt.danger { color: var(--danger); }
.p-title.count { font-weight: 400; font-style: italic; }
.info { margin: 0; padding: 0 12px 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; }
.modal .p-title.plain { font: 400 18px/1.3 var(--body); }
.opt.ctl { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.p-sub { margin: 0; padding: 0 4px 8px 12px; display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 500; }
.p-sub span { flex: 1; font-variant-numeric: tabular-nums; }
.p-sub button { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--accent); }
.p-sub button:hover, .p-sub button:active { background: var(--bg); }
.p-body { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.p-body textarea { width: 100%; min-height: 180px; resize: vertical; font: 14px/1.4 ui-monospace, "Roboto Mono", Menlo, monospace; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; }
.p-body textarea:focus { border-color: var(--accent); outline: none; }
.pick-line { display: flex; align-items: center; gap: 10px; }
.pick { color: var(--accent); border-color: var(--accent); }
.pick-name { min-width: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
#overlay.wide #panel { width: min(420px, 100%); }

#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  max-width: 480px; margin-inline: auto; padding: 12px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 12px;
}
#undoBtn {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  height: 44px; padding: 0 22px; border-radius: 22px; background: var(--del); color: var(--on-del);
  font-weight: 700; letter-spacing: .06em; box-shadow: var(--shadow);
}
#toast span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#toast button { flex: none; min-height: 36px; padding: 0 8px; font-weight: 700; text-decoration: underline; color: inherit; }
@media (prefers-reduced-motion: reduce) { .sorting .row { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <button id="back" class="chip" type="button" aria-label="Back to all lists" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 5 9l6 6"/></svg>
    </button>
    <h1><button id="title" type="button" disabled></button></h1>
    <input id="titleInput" type="text" maxlength="80" aria-label="List name" enterkeyhint="done" hidden>
    <button id="menuBtn" class="chip" type="button" aria-label="Options" aria-haspopup="menu" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 4.5h12M3 9h12M3 13.5h12"/></svg>
    </button>
  </header>
  <p id="note" class="note" hidden></p>
  <p id="sync" class="note warn" role="status" hidden>Not saved yet. Retrying…</p>
  <ul id="rows"></ul>
  <div id="empty" class="empty"><strong>Opening your lists</strong>One moment.</div>
</div>

<button id="addBtn" type="button" aria-label="Add" hidden>
  <svg class="i-add" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M13 5v16M5 13h16"/></svg>
  <svg class="i-done" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14.5 5.5 5.5L22 9"/></svg>
</button>

<div id="overlay" hidden><div id="panel" role="dialog" aria-modal="true"></div></div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<button id="undoBtn" type="button" aria-label="Undo" hidden>UNDO</button>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rowsEl = $('rows');
  const LS_KEY = 'listshelf.lists.v1';
  const VIEW_KEY = 'listshelf.view';
  const OUT_KEY = 'listshelf.unsaved.v1';
  const RP_KEY = 'listshelf.restorepoints.v1';
  const RP_EVERY = 24 * 60 * 60 * 1000;
  const SET_KEY = 'listshelf.settings.v1';
  const DEFAULTS = { theme: 'system', recentDays: 0, keepStarred: false, starredFirst: false, newAtBottom: false, confirmListSwipe: false, autoPoints: true, keepPoints: 7, undoSeconds: 7, sound: true, soundLevel: 50, vibrate: true };
  let settings = Object.assign({}, DEFAULTS);   // recentDays 0 shows every completed item
  let settingsBusy = false;
  let showOlder = null;          // id of the list whose older completed items are being shown for now
  let points = [];               // restore points: [{id, savedAt, auto, lists}] kept in the account, newest first
  const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.5 2.8 2.8L11 4.5"/></svg>';
  const LIST_ICON = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 5h8M8 10h8M8 15h8"/><circle cx="4" cy="5" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>';
  const STAR = '<svg class="i-star" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/></svg>';
  const TRASH = '<svg class="i-trash" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';

  const state = {
    mode: 'loading',      // loading | cloud | local
    lists: [],            // [{id, name, order, addType, items:[{id, text, type, done}]}]
    view: null,           // open list id, or null for the shelf of all lists
    select: false,
    picked: new Set(),
  };
  let col = null;                 // the viewer's private collection, in cloud mode
  const pending = new Map();      // list id -> {running, dirty, timer}
  let drag = null;
  let skipClick = false;
  let anchor = null;            // the row most recently picked, where a range selection starts
  let press = null;             // a finger down on a row: waiting, swiping sideways, or held long enough to reorder or select
  let panelOpen = false;
  let armed = false, exiting = false;
  let editing = false;
  let editingList = null;        // id of the list an item is being typed into
  let activeCommit = null;       // saves the text being typed right now, if any
  let deferred = false;
  let wantView = null;
  try { wantView = sessionStorage.getItem(VIEW_KEY); } catch (e) {}

  const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const current = () => state.lists.find((l) => l.id === state.view) || null;
  const sortLists = () => state.lists.sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name));

  const stamp = (v) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : 0);   // 0 means not recorded
  function norm(id, x) {
    const out = {
      id,

    const anyMarked = rows.some((r) => isMarked(r.trim()));
    const sepMode = rows.some((r) => SEP.test(r));
    /* Is row k followed by a blank line and then a checked or unchecked item (or the end)? That is how a list name looks. */
    const looksLikeName = (k) => {
      let j = k + 1;
      if (j < rows.length && rows[j].trim()) return false;
      while (j < rows.length && !rows[j].trim()) j++;
      return j >= rows.length || isMarked(rows[j].trim());
    };
    const out = []; let cur = null, lastItem = null, blank = true, needName = true;
    const addTo = (it, t) => { const m = t.replace(FAV, ''); if (m !== t) { it.fav = true; t = m; } it.text += '\n' + t; };
    rows.forEach((raw, k) => {
      const line = raw.trim();
      if (sepMode && SEP.test(raw)) { cur = null; lastItem = null; needName = true; blank = true; return; }
      if (!line && lastItem && /^[ \t]{4,}$/.test(raw)) { lastItem.text += '\n'; return; }   // an indented empty line inside an exported item
      if (!line) {
        if (sepMode && lastItem) lastItem.text += '\n';   // a blank line inside an item, kept as a paragraph break
        else lastItem = null;
        blank = true; return;
      }
      const marked = isMarked(line);
      if (!marked) {
        let isName;
        if (sepMode) {
          if (needName) isName = true;
          else if (anyMarked && lastItem) { addTo(lastItem, line); blank = false; return; }
          else isName = false;
        } else {
          /* Extra lines of an item: indented under it (this app's export), or straight after it as Microsoft To Do writes them. */
          if (lastItem && (/^[ \t]{4,}/.test(raw) || (!blank && anyMarked && !looksLikeName(k)))) { addTo(lastItem, line); blank = false; return; }
          isName = anyMarked || !cur || (blank && cur.items.length);
        }
        if (isName) { cur = { name: line.replace(/\s+/g, ' ').slice(0, 80), items: [] }; out.push(cur); needName = false; lastItem = null; blank = false; return; }
      }
      let done = false, t = line;
      if (DONE.test(line)) { done = true; t = line.replace(DONE, ''); }
      else if (OPEN.test(line)) t = line.replace(OPEN, '');
      let fav = false;
      if (marked) { const m = t.replace(FAV, ''); if (m !== t) { fav = true; t = m; } }
      if (!t.trim()) { blank = false; return; }
      if (!cur) { cur = { name: 'Imported list', items: [] }; out.push(cur); needName = false; }
      lastItem = { id: newId('i'), text: t, done, fav, created: Date.now(), changed: Date.now(), completedAt: 0 };
      cur.items.push(lastItem);
      blank = false;
    });
    out.forEach((l) => l.items.forEach((i) => { i.text = cleanText(i.text).slice(0, 2000); }));
    return out.filter((l, n) => l.items.length || l.name !== 'Imported list' || n > 0);
  }
  function openImport() {
    const body = el('div', 'p-body'), ta = el('textarea'), file = el('input');
    ta.id = 'importText'; ta.setAttribute('aria-label', 'Text to import'); ta.placeholder = 'Groceries\n\n  ❏ Milk\n  ✔ Eggs';
    file.id = 'importFile'; file.type = 'file'; file.hidden = true; file.tabIndex = -1;
    file.addEventListener('change', () => {
      const f = file.files && file.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { ta.value = String(r.result || ''); };
      r.onerror = () => toast('That file could not be read.');
      r.readAsText(f);
    });
    const pick = el('button', 'chip pick', 'Choose a file'); pick.type = 'button';
    const picked = el('span', 'pick-name', '');
    pick.addEventListener('click', () => { try { file.value = ''; file.click(); } catch (e) { toast('This device would not open the file picker. Paste the file\u2019s text instead.'); } });
    file.addEventListener('change', () => { const f = file.files && file.files[0]; picked.textContent = f ? f.name : ''; });
    const line = el('div', 'pick-line'); line.appendChild(pick); line.appendChild(picked);
    body.appendChild(ta); body.appendChild(line); body.appendChild(file);
    openPanel({
      title: 'Import lists', body,
      hint: 'Paste a list exported from Microsoft To Do, or choose a text file or a backup file.',
      opts: [{ label: 'Import', act: () => doImport(ta.value) }, { label: 'Cancel', act: () => {} }],
    });
  }
  function doImport(text) {
    if (!text.trim()) { toast('Nothing to import.'); return; }
    let backup = null;
    try { const j = JSON.parse(text); if (j && j.app === 'lists-backup' && Array.isArray(j.lists)) backup = j; } catch (e) {}
    if (backup) {
      const lists = backup.lists.filter((x) => x && typeof x.id === 'string' && /^[A-Za-z0-9_\-]{1,100}$/.test(x.id)).map((x) => norm(x.id, x));
      if (!lists.length) { toast('That backup has no lists in it.'); return; }
      const same = lists.filter((l) => state.lists.some((x) => x.id === l.id)).length;
      openPanel({
        title: 'Restore ' + lists.length + (lists.length === 1 ? ' list' : ' lists') + ' from backup?',
        hint: (same ? same + (same === 1 ? ' of them replaces the current version of the same list. ' : ' of them replace the current versions of the same lists. ') : '') + 'No other lists are changed or deleted.',
        opts: [{ label: 'Restore', act: () => {
          lists.forEach((l) => { state.lists = state.lists.filter((x) => x.id !== l.id); state.lists.push(l); persist(l.id, true); });
          sortLists(); render(); toast('Restored ' + lists.length + (lists.length === 1 ? ' list.' : ' lists.'));
        } }, { label: 'Cancel', act: () => {} }],
      });
      return;
    }
    const found = parseLists(text);
    if (!found.length) { toast('No lists were found in that text.'); return; }
    let order = state.lists.length ? Math.max(...state.lists.map((x) => x.order)) + 1 : 0;
    found.forEach((f) => {
      const l = { id: newId('l'), name: f.name || 'Imported list', order: order++, created: Date.now(), changed: 0, items: f.items.filter((i) => !i.done).concat(f.items.filter((i) => i.done)) };
      state.lists.push(l); persist(l.id);
    });
    render();
    const n = found.reduce((a, f) => a + f.items.length, 0);
    toast('Imported ' + found.length + (found.length === 1 ? ' list' : ' lists') + ' with ' + n + (n === 1 ? ' item.' : ' items.'));
  }

  function selectAll() {
    const list = current();
    (list ? shown(list) : state.lists).forEach((r) => state.picked.add(r.id));
    state.select = state.picked.size > 0;
    render();
  }
  function openDest(copy) {
    const list = current(); if (!list) return;
    const others = state.lists.filter((l) => l.id !== list.id);
    openPanel({
      title: copy ? 'Copy to' : 'Move to', hint: others.length ? '' : 'There are no other lists yet. Create one from the Lists page first.',
      opts: others.map((l) => ({ label: l.name, act: () => sendTo(l.id, copy) })).concat([{ label: 'Cancel', act: () => {} }]),
    });
  }
  function sendTo(destId, copy) {
    const src = current(), dest = state.lists.find((l) => l.id === destId);
    if (!src || !dest) return;
    let moving = src.items.filter((i) => state.picked.has(i.id));
    if (!moving.length) return;
    if (copy) moving = moving.map((i) => ({ id: newId('i'), text: i.text, done: i.done, fav: !!i.fav, created: Date.now(), changed: Date.now(), completedAt: i.completedAt || 0 }));
    else src.items = src.items.filter((i) => !state.picked.has(i.id));
    dest.items = moving.filter((i) => !i.done).concat(dest.items.filter((i) => !i.done), moving.filter((i) => i.done), dest.items.filter((i) => i.done));
    persist(dest.id); if (!copy) persist(src.id);
    toast((copy ? 'Copied ' : 'Moved ') + moving.length + (moving.length === 1 ? ' item' : ' items') + ' to ' + dest.name + '.');
    deselect();
  }
  function confirmDelete() {
    const list = current(), n = state.picked.size; if (!n) return;
    const noun = list ? (n === 1 ? 'item' : 'items') : (n === 1 ? 'list' : 'lists');
    openPanel({
      title: 'Delete ' + n + ' ' + noun + '?', hint: list ? '' : 'Everything in ' + (n === 1 ? 'it' : 'them') + ' is deleted too.',
      opts: [{ label: 'Delete', danger: true, act: doDelete }, { label: 'Cancel', act: () => {} }],
    });
  }
  function doDelete() {
    const list = current();
    if (list) {
      const listId = list.id, removed = [];
      list.items.forEach((it, idx) => { if (state.picked.has(it.id)) removed.push({ it, idx }); });
      if (!removed.length) { deselect(); return; }
      list.items = list.items.filter((i) => !state.picked.has(i.id));
      persist(listId);
      deselect();
      showUndo(() => {
        const l = state.lists.find((x) => x.id === listId); if (!l) return;
        removed.forEach(({ it, idx }) => { if (!l.items.some((i) => i.id === it.id)) l.items.splice(Math.min(idx, l.items.length), 0, it); });
        l.items = l.items.filter((i) => !i.done).concat(l.items.filter((i) => i.done));
        persist(listId); render();
      });
    } else {
      const removed = state.lists.filter((l) => state.picked.has(l.id));
      if (!removed.length) { deselect(); return; }
      state.lists = state.lists.filter((l) => !state.picked.has(l.id));
      removed.forEach((l) => persist(l.id, true));
      deselect();
      showUndo(() => {
        removed.forEach((l) => { if (!state.lists.some((x) => x.id === l.id)) { state.lists.push(l); persist(l.id, true); } });
        sortLists(); render();
      });
    }
  }
  $('menuBtn').addEventListener('click', openMenu);

  /* ---------- leaving: the back gesture steps out one level; on the main page a second swipe leaves ---------- */
  let leaveTimer = 0;
  function arm() { if (armed) return; try { history.pushState({ lists: 1 }, ''); armed = true; } catch (e) {} }
  window.addEventListener('pointerdown', () => { if (!armed && !exiting) { clearTimeout(leaveTimer); exiting = false; arm(); } }, true);
  window.addEventListener('popstate', () => {
    armed = false;
    if (exiting) return;
    if (panelOpen) closePanel();
    else if (editing && document.activeElement) document.activeElement.blur();
    else if (state.select) deselect();
    else if (state.view) setView(null);
    else {
      /* Nothing left to step out of: the next back swipe is passed on and leaves the app. */
      exiting = true; toast('Swipe back again to exit.');
      clearTimeout(leaveTimer); leaveTimer = setTimeout(() => { exiting = false; arm(); }, 3000);
      return;
    }
    arm();
  });

  /* ---------- bars and title ---------- */
  $('addBtn').addEventListener('pointerdown', (e) => { if (editing) e.preventDefault(); });   // keep the text focused until the tap lands
  $('addBtn').addEventListener('mousedown', (e) => { if (editing) e.preventDefault(); });
  $('addBtn').addEventListener('click', () => {
    if (editing) { const a = document.activeElement; if (a && (a.isContentEditable || a === titleInput)) a.blur(); return; }
    const list = current();
    if (document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
    if (list) {
      const live = current(); if (!live) return;
      const it = { id: newId('i'), text: '', done: false, fav: false, created: Date.now(), changed: Date.now(), completedAt: 0 };
      const open = live.items.filter((i) => !i.done);
      live.items.splice(settings.newAtBottom ? open.length : settings.starredFirst ? open.filter((i) => i.fav).length : 0, 0, it);
      render();
      const row = liveRow(it.id), span = row && row.querySelector('.text');
      if (row) row.scrollIntoView({ block: 'center' });
      if (span) startEdit(span, it.id, live.id);
    } else {
      const l = { id: newId('l'), name: 'Untitled list', order: 0, created: Date.now(), changed: 0, items: [] };
      state.lists.unshift(l);
      state.lists.forEach((x, i) => { if (x.order !== i || x === l) { x.order = i; persist(x.id, true); } });
      setView(l.id);
      startRename(true);
    }
  });
  $('back').addEventListener('click', () => setView(null));
  const titleBtn = $('title'), titleInput = $('titleInput');
  titleBtn.addEventListener('click', (e) => startRename(false, e));
  function startRename(blank, ev) {
    const list = current(); if (!list) return;
    const at = caretOffset(ev, titleBtn);
    titleBtn.parentElement.hidden = true; titleInput.hidden = false;
    titleInput.value = blank ? '' : list.name; titleInput.placeholder = 'List name'; editing = true;
    titleInput.focus();
    const pos = at != null ? Math.min(at, titleInput.value.length) : titleInput.value.length;
    try { titleInput.setSelectionRange(pos, pos); } catch (e) {}
  }
  let titleCancelled = false, titleOrig = '', titleTimer = 0;
  function putTitle(v) { const list = current(); if (list && v && v !== list.name) { list.name = v; persist(list.id); } }
  const commitTitle = () => putTitle(titleInput.value.replace(/\s+/g, ' ').trim());
  titleInput.addEventListener('focus', () => { const list = current(); titleOrig = list ? list.name : ''; activeCommit = commitTitle; finishMode(true); keepInView(titleInput); });
  titleInput.addEventListener('input', () => { clearTimeout(titleTimer); titleTimer = setTimeout(commitTitle, 500); });
  titleInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); titleInput.blur(); }
    else if (e.key === 'Escape') { titleCancelled = true; titleInput.blur(); }
  });
  titleInput.addEventListener('blur', () => {
    clearTimeout(titleTimer);
    finishMode(false);
    if (titleCancelled) putTitle(titleOrig); else commitTitle();
    titleCancelled = false; editing = false; activeCommit = null;
    titleInput.hidden = true; titleBtn.parentElement.hidden = false;
    render();
  });

  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', flushAll);
  window.addEventListener('online', flushAll);

  render();
  init();
})();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
